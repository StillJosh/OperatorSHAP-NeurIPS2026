defaults:
  - common
  - dataset: advection_1d
  - attribution: eval
  - _self_
  - mode: default

run_kind: metrics
run_name: ${run_kind}_n${attribution.n_players}

metrics:
  n_coalitions: 10000
  ig_steps: 50
  ig_batch_size: 64
  cheap_budget: ${eval:'max(2 * ${attribution.n_players}, 1024)'}
  references:
    Reference: ${output_root}/${dataset.reference_short}/${model.family}/shap_n${attribution.n_players}_${dataset.reference_segment}/shapley_values.npz
    RMSR: ${output_root}/${dataset.reference_short}/${model.family}/shap_n${attribution.n_players}_ps_b${metrics.cheap_budget}/shapley_values.npz
    KernelSHAP: ${output_root}/${dataset.reference_short}/${model.family}/shap_n${attribution.n_players}_ks_b${metrics.cheap_budget}/shapley_values.npz

in_channels: ${eval:'${dataset.in_channels} + 1'}
out_channels: 1
