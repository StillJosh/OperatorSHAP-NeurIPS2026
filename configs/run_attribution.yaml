defaults:
  - common
  - dataset: advection_1d
  - training: fastshap
  - optimizer: adamw
  - scheduler: cosine
  - loss@train_loss: mse
  - loss@val_loss: mse
  - attribution: fastshap
  - _self_
  - mode: default

run_name: ${attribution.run_name}

in_channels: ${eval:'${dataset.in_channels} + 1'}
out_channels: 1

dataset:
  resolutions: ${dataset.explainer_resolutions}

training:
  batch_size: ${dataset.explainer_batch_size}

optimizer:
  lr: ${dataset.explainer_lr}
  weight_decay: 1.0e-5
